S={_주석:["화면정의서 PPT의 업무영역 간지에 들어가는 설명이다. 사람이 쓰는 문구이므로 생성물이 아니다.","회사 이름은 ui-spec.json의 meta.slug와 같아야 한다. 영역 이름은 design.json td3.screens의 area와 같아야 한다.","'_공통'은 회사를 가리지 않고 적용된다. 같은 이름이 회사 쪽에도 있으면 회사 것이 이긴다.","여기에 없는 영역은 간지에 화면 이름이 대신 나열된다 — 틀린 설명이 실리는 것보다 낫다."],_공통:{공통화면:"모든 업무 화면에 공통으로 적용되는 메인·로그인·팝업·대시보드 화면이다."},경동글로벌텍:{"AI 대시보드":"생산·품질·설비·출하 현황을 현황판과 관리자 Web에 실시간으로 표출하는 영역이다.",수주견적AI관리:"CAD 도면을 분석해 견적과 BOM을 자동 산출하는 AI 영역이다. 산출값은 신뢰도와 근거를 함께 표시한다.",입고재고관리:"원자재 입고 시 LOT·규격·중량을 등록하고 공급처 품질까지 추적하는 영역이다.",출하물류관리:"출하 실적과 LOT 추적, 출하검사 결과와 클레임을 관리하는 영역이다.",공정관리:"10개 공정의 실적·작업조건·이력을 수집하고 분석하는 영역이다.","사용자/시스템관리":"계정과 권한, 로그와 알림, 시스템 설정을 관리하는 영역이다.",기준정보관리:"품질기준·작업표준·공통코드 등 전 화면이 참조하는 기준 데이터 영역이다.",데이터관리:"수집 데이터를 통합·조회·시각화하고 AI 학습 데이터를 관리하는 영역이다.","AI Agent 통합관리":"자연어 질의로 생산·품질을 분석하고 의사결정을 지원하는 RAG 기반 Agent 영역이다.",KPI관리:"성과지표를 산출·조회하고 목표를 관리하는 영역이다."},니즈푸드:{기준정보관리:"메뉴(식단)·레시피BOM·원부자재·공정기준·검식기준 등 전 화면이 참조하는 기준 데이터를 관리한다. 레시피를 배치(솥) 단위 정량으로 정의하여 생산·원가·품질의 공통 기준으로 삼는다.",영업관리:"고객사에서 접수한 일일·정기 급식 수주를 등록하고, 납기 일정과 수주 대비 출고 현황을 확인한다. SCM(2021년 구축)과의 연계 항목·주기·방식은 착수 전 확정이 필요하다.",자재관리:"원료와 완제품의 재고, 보관 위치 간 이동·실사 차이 조정·폐기 이력을 관리한다. 생산계획과 활성 BOM으로 원부자재 총 소요량을 계산해 가용재고와 비교하고 부족분을 산출한다.",생산관리:"수주에서 일·주 단위 생산계획을 만들고, 이를 배치(솥) 단위 작업지시서로 분해해 현장 화면에 내린다. 배치별 생산실적을 조리 조건 데이터와 함께 수집한다.",품질관리:"샘플링검식 기준에 따라 검식 대상과 일정을 계획하고, 현장에서 결과와 사진을 입력해 품질 데이터를 디지털로 축적한다. 이물·품질 이상과 고객 클레임은 이슈로 등록해 조치 이력을 남긴다.",공정관리:"작업지시서의 공정 단계별 진행 상태를 실시간으로 조회·갱신하고, 진행 중 발생한 지연을 사유별로 분류·기록하여 개선 우선순위 도출에 활용한다.",설비관리:"설비의 가동·비가동 상태와 이력, 예방점검 계획과 결과, 이상·고장의 조치·복구 이력을 관리한다.",KPI모니터링:"생산성·품질 지표를 조회하고 지표의 계산식과 목표값을 관리한다. 성과지표는 시간당 생산량 300→350인분/시간, 완제품 불량률 7.5→6.5%, 레시피 표준화율 0→90%다.",POP작업:"현장 작업자가 터치로 쓰는 화면이다. 작업지시서와 라인·설비를 선택해 생산 진행을 가동·정지·완료로 제어하고, 입고와 출고 작업에서 불량을 함께 등록한다.","AI 에이전트":"관리자·영양사가 자연어로 질의하면 생산·불량·비가동 현황을 요약해 답한다. 일일·주간 운영 리포트를 자동 생성하며 질의·응답·리포트 생성 이력을 모두 기록한다.",대시보드:"수주·출하·생산·불량 등 공정별 통합 현황을 한 화면에 제공하고, 위젯을 누르면 상세 분석 화면으로 들어간다.",시스템관리:"사용자 계정과 역할별 메뉴·기능 권한, 접속·변경 로그, DB 백업·복구 이력을 관리한다."},임진강김치:{기준정보관리:"제품품목·레시피BOM·공정CCP 기준값·설비/절임통·거래처·작업자·공통코드 등 전 화면이 참조하는 기준 데이터를 관리한다. 레시피는 김치 종류별 BOM 구조로 등록하고 변경 이력을 남긴다.",수주생산계획관리:"카카오톡·팩스로 접수하던 주문을 시스템에 직접 등록하고, 수주에서 일·주 단위 생산계획과 작업지시서를 만들어 현장에 자동 전파한다. 수주 변경 이력과 수주 대비 출고 현황도 함께 본다.",자재재고관리:"배추·무·고춧가루·마늘 등 원부자재의 입고와 이력을 관리한다. 하루 두 번 엑셀로 집계하던 재고를 스마트패드 즉시 입력 기반 실시간 재고로 바꾸고, 레시피BOM으로 투입량을 산출해 재고를 차감한다.",입고전처리관리:"원물 입고 시 이물·부패 검수 결과를 디지털로 기록하고, 배추 투입 중량과 전처리 후 중량을 비교해 손실률을 산출한다. 기준을 넘으면 알람한다.",세척공정관리:"세척 시간·물 사용량·처리 중량 기준을 등록해 실적과 대비하고, 소독수 농도(ppm)와 접촉시간을 자동 기록해 기준 유지 여부를 관리한다.",절임공정관리:"배추 크기·중량별 염도와 절임 시간 기준을 설정하고, 절임통 8기의 상태·절임 시간·염도를 기록해 진행 현황을 본다. 과절임·절임부족 발생은 이력으로 남긴다.",양념버무림공정관리:"양념 투입량을 작업자별로 계량·기록해 배합 편차를 관리하고, 속넣기·충진기 설비의 작업 속도와 세팅값을 수집한다. 버무림 공정의 CCP 기준값과 이탈 여부를 함께 관리한다.",포장출하관리:"육안·샘플링으로 하던 중량 검사를 포장 중량 기준 전수 검사로 전환한다. 아이스박스 자동테이핑기의 포장 실적과 가동 상태를 수집하고, 출하 전 냉장고 입·출고를 스마트패드로 관리한다.",숙성냉장관리:"3주 숙성 제품의 숙성 재고와 출하 가능 시점을 관리하고, 숙성·원품·탈수 냉장고의 온·습도를 자동 수집해 기준 이탈 시 알람한다.",품질이상관리:"입고·절임·양념·버무림·포장 공정별 불량 유형을 데이터화하고, 금속검출기 검사 결과를 자동 수집해 기준 초과 시 즉시 알람·기록한다. 품질 이슈는 원인–조치–재발방지까지 이력으로 남긴다.",시스템관리:"MES 사용자 계정과 권한 역할 매핑, 접속·변경 로그, 백업 수행 이력을 관리한다.",KPI모니터링:"생산성·품질·재고 지표를 대시보드 형식으로 조회하고 지표의 계산식과 기준을 관리한다. 성과지표는 시간당 생산량 601.6→700kg/h(16.7% 증가), 완제품 불량률 1.70→1.30%(23.5% 감소)다.",설비관리:"설비의 가동·비가동 상태, 정기 점검 결과, 이상·고장 발생과 조치 이력을 등록·조회한다.",POP작업:"현장 작업자가 POP 단말에서 쓰는 화면이다. 작업지시서와 라인·설비를 선택해 작업의 가동·정지·완료를 제어하고, 입고와 출고 작업에서 불량을 함께 등록한다.","검색 Agent":"자연어로 질의하면 생산·불량·비가동 현황을 요약해 답한다. 일일·주간 리포트를 자동 생성하며 리포팅·분석 이력을 기록한다.",대시보드:"수주·출하·생산·불량 등 주요 지표를 한 화면에 노출하고, 지표별 상세 현황은 드릴다운으로 본다. 노출할 관리 지표는 선택할 수 있다."},광성정밀:{"AI 대시보드":"생산량·가동률·공정 진행률과 불량률·설비 상태·출하 현황을 실시간으로 집계해 시각화한다. 설비 상태는 진동·전류·온도 데이터를 근거로 본다.",원자재입고관리:"자재 입고를 LOT 기준으로 등록하고 수입검사 데이터와 규격·품질 기준을 함께 관리한다. 공급처별 불량률·납품 이력으로 공급처를 평가하며, RAG 기반 AI Agent가 자재 이력과 리스크를 자연어로 답해 입고 적합성 판단을 돕는다.",프레스공정관리:"프레스 압력·금형온도·스트로크·진동을 실시간 수집해 표준 작업조건과 대비하고, 공정 변수 간 상관관계로 품질 영향 요인을 도출한다. 불량 발생 확률을 사전 예측해 주요 영향 변수와 공정 조건 조정안을 리포트로 낸다.",출하관리:"출하 LOT에 생산 이력과 검사 결과를 묶어 등록하고 문서·라벨·인증 데이터를 관리한다. 출하량·납기·품질을 분석하며 AI Agent가 납기 리스크와 클레임 원인 분석을 지원한다.",공정관리:"공정별 생산 실적과 속도·압력·전류·온도 등 센서 데이터를 통합해 모니터링한다. 표준 작업조건과 실제 작업 데이터를 비교해 수율·불량률·병목 원인을 도출하고 LOT 기준으로 공정 이력을 추적한다.","사용자/시스템관리":"사용자 계정과 역할 기반 접근권한(RBAC), 사용·작업 로그, 시스템·인터페이스 설정, 알림 기준과 수신 대상을 관리한다.",기준정보관리:"제품별 품질·검사 기준, 공정별 작업 절차와 조건 표준, 품목·공정·설비 공통코드 등 전 화면이 참조하는 기준 데이터를 관리한다.",데이터허브관리:"MES·ERP·IoT·공정 데이터를 단일 저장소로 통합해 상태를 모니터링하고, LOT 기준 조회·시각화·다운로드를 제공한다. AI 학습용 데이터셋을 등록하고 품질을 관리한다. 프레스·전착 공정만으로 각 일 10GB 규모가 쌓인다.","AI Agent 통합관리":"자연어로 생산·품질·출하 등 전 공정 정보를 조회하고, 자동 분석 리포트와 의사결정 추천, 이상 발생 알림을 받는다. 사용자 질의 이력을 저장해 반복 학습과 개선에 활용한다.","KPI 관리":"생산성·품질 지표를 자동 산출해 조회하고 목표값과 달성률을 관리한다. 다만 성과지표 목표값은 사업계획서 1.5의 6개 행이 전부 '(예시)'여서 구축 전 실측값·목표값 확정이 필요하다."},평창꽃순이김치:{"AI 대시보드":"공정별 생산량·작업 진행률·설비 가동 상태와 품질·발효·출하 현황을 실시간으로 시각화해 전체 생산 흐름을 한 화면에서 본다.",원재료관리:"원재료 입고 시 LOT를 생성하고 공급처·원산지·중량을 등록해 후속 공정과 연계한다. 선별 데이터와 공급처 품질을 함께 관리하며, AI Agent가 원재료 이력과 입고 판단을 자연어로 돕는다.",숙성발효관리:"LOT별 발효 온도·pH·산도 변화를 실시간으로 보고 발효 완료 시점을 예측한다. 이상 발효는 알림으로 띄우고, ML 분석으로 품질에 영향을 주는 공정조건과 요인을 도출한다.",포장출하관리:"포장량·중량·작업시간으로 포장 실적을 관리하고, 출하와 LOT 추적·검사결과·클레임 분석을 연계한다. AI Agent가 출하 판단과 LOT 이력 질의를 지원한다.",공정관리:"공정별 작업시간·처리량·작업자 정보로 실적을 관리하고 공정 데이터를 모니터링한다. 레시피와 공정 이력을 기준으로 생산성 분석과 공정 개선을 수행한다.","사용자/시스템관리":"사용자 계정과 역할 기반 접근 제어, 작업 로그, 알림 기준, 시스템 설정을 관리한다.",기준정보관리:"품질·검사 기준과 작업표준, 공통코드 등 전 화면이 참조하는 기준 데이터를 관리한다. 품질 기준은 AI 판단 기준으로도 쓰인다.",데이터관리:"IoT·공정 데이터를 단일 저장소로 통합해 정합성을 확보하고, 조회·시각화·다운로드와 AI 학습 데이터셋 관리를 제공한다.","AI Agent 통합관리":"자연어로 생산·품질·출하 전 공정을 조회하고, 분석 리포트·의사결정 추천·이상 알림을 받는다. 질의 이력은 저장해 개선에 활용한다.","KPI 관리":"공정별 생산량·작업시간·설비 가동률(OEE)·시간당 생산량을 자동 산출해 병목 공정을 식별하고 목표를 관리한다. 성과지표는 시간당 생산량 2,750→3,000kg/h(+9.1%), 완제품 불량률 1.5→1.0%다."},원터치:{"AI 대시보드":"공정별 생산량·작업 진행률·설비 가동 상태와 품질·출하 현황을 실시간으로 시각화해 전체 생산 흐름을 단일 화면에서 파악한다.",입고재고관리:"원자재 입고 시 LOT·규격·중량을 자동 등록하고 입고 이력과 연계해 자재 흐름을 추적한다. 공급처별 품질을 분석하며 RAG 기반 AI Agent가 자재 이력 질의를 지원한다.",수주견적AI관리:"CAD 도면(PDF/DWG)을 파싱과 Vision AI로 분석해 객체와 치수를 자동 추출하고, 그 결과로 견적과 BOM을 자동 산출한다. ML로 원가·생산성을 예측하고 SHAP으로 영향요인을 함께 제시한다.",출하물류관리:"고객사·출하일자·수량·납기를 관리하고 MES와 ERP를 연계해 출하 지시와 실적을 통합한다. LOT 추적·검사결과·클레임 분석과 출하 AI Agent를 제공한다.",공정관리:"코일 투입·타공·성형(롤포밍)·용접·절단 공정의 실적과 작업 이력을 수집해 목표 대비 실적을 비교하고, 표준 작업조건과 실제 데이터를 대조해 공정을 분석한다.","사용자/시스템관리":"사용자 계정과 역할 기반 접근제어(RBAC), 작업 로그, 알림 설정, 시스템 설정을 관리한다.",기준정보관리:"제품별 품질·검사 기준, 작업표준, 공통코드 등 전 화면이 참조하는 기준 데이터를 관리한다. 품질 기준은 판정 기준 데이터로 쓰인다.",데이터관리:"MES·ERP·IoT·공정 데이터를 단일 저장소(Data Hub)로 통합해 정합성을 확보하고, 조회·시각화·다운로드와 AI 학습 데이터 관리를 제공한다.","AI Agent 통합관리":"자연어로 생산·품질·출하 전 공정을 조회하고, 분석 리포트·의사결정 추천·이상 알림을 받는다. 질의 이력은 저장해 개선에 활용한다.","KPI 관리":"생산량·설비가동률(OEE)·공정 리드타임 등 생산성 지표와 품질 지표를 조회하고 목표를 관리한다. 다만 성과지표는 사업계획서 1.5의 6개 항목이 전부 '(예시)'여서 기존값·목표값 확정이 필요하다."},와이엔프린팅:{"AI 대시보드":"공정별 생산량·작업 진행률·설비 가동 상태와 품질·인쇄 상태·출하 현황을 실시간으로 집계해 한 화면에서 조회한다.",입고검사관리:"원지·잉크·부자재 입고를 LOT·공급처·규격 단위로 등록하고 입고검사 데이터와 원재료 이력을 관리한다. 공급처 품질을 리포트로 분석하고 AI Agent가 자재 이력 질의에 답한다.",인쇄AI관리:"비전과 센서 데이터를 결합해 잉킹로라·닥터블레이드 구간의 잉크 전달 균일도를 실시간 감시하고, 인쇄 품질과 불량 발생을 예측한다. 이상은 알림으로 띄우고 SHAP으로 영향요인을 제시한다.","인쇄판 문안 정합성 검사 AI":"비전 카메라로 찍은 인쇄판 이미지를 원본 문안과 자동 비교하고, OCR로 미세 문자 누락·오탈자·번짐을 검출한다. 검사 결과와 문안 불량 패턴을 이력으로 관리한다.","목형 칼날 불량 검사 AI":"목형 칼날 이미지를 촬영해 마모·휨·파손을 비전 AI로 분석하고 재단 품질 이상 가능성을 사전에 검출한다. 재단 품질 이력과 목형 유지보수를 함께 관리한다.",공정관리:"인쇄·톰슨(타발)·재단·포장 공정별 작업 실적과 설비별 생산량·작업시간을 관리하고, 표준 작업조건과 실제 데이터를 대조해 공정을 분석한다.",포장출하관리:"포장 실적을 포장LOT·박스ID·수량 단위로 관리하고 출하와 LOT 추적·출하검사·클레임 분석을 연계한다. AI Agent가 출하 관련 질의를 지원한다.",기준정보관리:"색상 편차·불량 유형·검사 기준·출하 기준과 작업표준, 공통코드 등 전 화면이 참조하는 기준 데이터를 관리한다.",데이터관리:"ERP·IoT·비전센서 등 원천별 수집 설정을 등록하고 통합 수집 상태를 감시하며, 조회·시각화·다운로드와 AI 학습 데이터 관리를 제공한다.","AI Agent 통합관리":"생산·품질·설비·표준 데이터를 대상으로 자연어 질의응답을 제공하고, 분석 리포트·의사결정 추천·이상 알림을 낸다. 질의 이력을 저장해 개선에 활용한다.","KPI 관리":"생산량·설비가동률·공정 리드타임과 품질 지표를 조회하고 목표·달성률을 관리한다. 성과지표는 완제품 불량률 5.0→4.0%, 수주출하 리드타임 24h→20h이며 기존값 표기가 상충해 확정이 필요하다.","사용자/시스템관리":"사용자 계정과 역할별 권한, 작업 로그, 알림 설정, 시스템 설정을 관리한다."},브랜뉴머시너리:{"AI 대시보드":"프로젝트별 제작 진행률과 공정별 작업 실적, 납기 위험 현황을 통합 분석해 보여 준다. 품질·설비 상태도 같은 화면 체계로 조회한다.",수주견적관리:"예상 원가 대비 마진율과 리스크를 자동 분석하고, 유사 프로젝트 이력으로 원가·납기를 예측한다. 제품별 견적 자동화 AI가 견적 산출을 돕는다.",구매관리:"BOM을 기준으로 발주 대상 자재를 확인해 발주를 등록하고 진행 상태와 자재 이력을 조회한다. 납기 리스크를 분석하
